<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Fleet Portal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 380px;
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .login-logo img {
      height: 48px;
      width: auto;
    }

    .login-logo__title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .login-divider {
      width: 40px;
      height: 2px;
      background: var(--green);
      border-radius: 2px;
      margin: 0 auto 4px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .form-input {
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .form-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(27,94,32,.15);
      background: #fff;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember-row input[type=checkbox] {
      accent-color: var(--green);
      width: 15px;
      height: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .remember-row label {
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .login-error {
      font-size: 13px;
      color: var(--red);
      background: var(--red-light);
      border: 1px solid #f5c6c6;
      border-radius: var(--radius-sm);
      padding: 9px 12px;
    }

    .login-btn {
      height: 42px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      letter-spacing: .2px;
    }

    .login-btn:hover:not(:disabled) { background: var(--green-light); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--subtle);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <img src="ntsl-logo.png" alt="NTSL" />
      <div class="login-divider"></div>
      <span class="login-logo__title">Fleet Portal</span>
    </div>

    <form class="login-form" onsubmit="handleLogin(event)">

      <p id="loginError" class="login-error" hidden></p>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" class="form-input" type="text"
               autocomplete="username" autocapitalize="none"
               spellcheck="false" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" class="form-input" type="password"
               autocomplete="current-password" required />
      </div>

      <div class="remember-row">
        <input id="remember" type="checkbox" />
        <label for="remember">Remember me</label>
      </div>

      <button id="loginBtn" class="login-btn" type="submit">Sign in</button>

    </form>
  </div>

  <div class="login-footer">Nationwide Truck Services Limited &mdash; Client Portal</div>

  <script src="data/d.js"></script>
  <script src="auth.js"></script>
  <script>redirectIfAuthenticated();</script>

</body>
</html>
